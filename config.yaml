model:
  name: "Janus"
  d_model: 128
  d_state: 16
  d_conv: 4
  n_layers: 4
  dropout: 0.25
  num_classes: 1
  head_type: "factorized"   # "mlp" or "factorized"
  max_scale: 0.08           # clamp scale head to ±8% (optional)

data:
  input_window: 64
  num_features: 13
  feature_columns:
    - "RSI_14_M15"
    - "ATR_5_pct_M15"
    - "dist_from_ema_10_M15"
    - "ema10_slope_M15"
    - "volume_oscillator_M15"
    - "obv_M15"
    - "hour_sin"
    - "hour_cos"
    - "RSI_14_H1"
    - "ADX_14_H1"
    - "EMA_diff_21_H4pct"
    - "RSI_15_x_NYHours"
    - "garch_volatility"
  target_column: "target"
  train_ratio: 0.75
  val_ratio: 0.15
  test_ratio: 0.10
  batch_size: 160
  num_workers: 4
  shuffle_train: true

training:
  epochs: 150
  learning_rate: 0.0006
  weight_decay: 0.008
  optimizer: "adamw"
  scheduler: "reduce_on_plateau"
  scheduler_patience: 10
  scheduler_factor: 0.7
  scheduler_min_lr: 0.00001
  warmup_epochs: 0
  gradient_clip: 1.5
  early_stopping_patience: 15
  early_stopping_min_delta: 0.000001
  save_best_only: true
  # Exponential Moving Average of weights for stabler validation/exports
  ema:
    use: true
    decay: 0.995
  # Overfitting guard: when generalization gap grows, refresh the head
  overfit_guard:
    enabled: true
    gap_threshold: 1.7     # val_loss / train_loss to trigger
    patience: 3            # epochs of sustained gap before action
    freeze_epochs: 2       # freeze backbone after reset to refit the head
    head_reinit: true      # reinitialize prediction head
    lr_boost: 1.5          # temporary LR multiplier for fast adaptation
  
loss:
  type: "huber"
  huber_delta: 1.0   # higher delta allows bolder residuals

paths:
  data_path: "/kaggle/input/janus-m15-dataset/janus_m15_dataset.parquet"
  output_dir: "/kaggle/working"
  checkpoint_dir: "checkpoints"
  results_dir: "results"
  logs_dir: "logs"

device:
  use_cuda: true
  device_id: 0
  mixed_precision: true

logging:
  log_interval: 10
  save_interval: 1
  tensorboard: true
  wandb: false

evaluation:
  metrics:
    - "mae"
    - "rmse"
    - "mse"
    - "r2_score"
    - "sign_accuracy"
  plot_predictions: true
  plot_residuals: true
  plot_training_curves: true

seed: 42
