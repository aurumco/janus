# Global settings
seed: 47

# Multi-asset configuration
assets:
  - "BTCUSDT"
  - "ETHUSDT"
  - "BNBUSDT"
  - "XRPUSDT"
  - "ADAUSDT"
  - "DOGEUSDT"
  - "SOLUSDT"
  - "DOTUSDT"
  - "MATICUSDT"
  - "LTCUSDT"
  - "AVAXUSDT"
  - "LINKUSDT"
  - "UNIUSDT"
  - "ATOMUSDT"
  - "ETCUSDT"

# Pre-training configuration for SSL on 5min multi-asset data
pretrain:
  data:
    path: "/kaggle/input/janusds/janus_pretrain_5min/janus_pretrain_5min_dataset.parquet"
    sequence_length: 72
    batch_size: 34
    num_features: 16
    use_gpu_preprocess: false
    masking_ratio: 0.15
    volatility_lookahead: 60
    smart_masking_prob: 0.4
    cross_asset_masking_prob: 0.3
    train_ratio: 0.85
    val_ratio: 0.15
    test_ratio: 0.0
    num_workers: 0
    shuffle_train: true
    use_streaming_fallback: false
  
  model:
    name: "MambaFoundation"
    d_model: 192
    d_state: 16
    d_conv: 4
    n_layers: 6
    dropout: 0.1
    num_assets: 15
    asset_embedding_dim: 24
    reconstruction_head_dim: 16
    volatility_head_dim: 1
    use_gradient_checkpointing: true
  
  training:
    epochs: 100
    learning_rate: 0.00005
    weight_decay: 0.01
    optimizer: "adamw"
    scheduler: "cosine"
    warmup_epochs: 10
    gradient_clip: 0.5
    accumulation_steps: 4
    early_stopping_patience: 15
    early_stopping_min_delta: 0.00001
    save_best_only: true
  
  loss:
    masked_price_weight: 1.0
    volatility_weight: 0.5
    contrastive_weight: 0.2
    temporal_consistency_weight: 0.1
    temperature: 0.07

# Fine-tuning configuration for regression on 30min data
finetune:
  data:
    path: "/kaggle/input/janusds/janusdataset/janus_finetune_30min_dataset.parquet"
    sequence_length: 96
    batch_size: 128
    num_features: 16
    feature_columns:
      - "RSI_14_M15"
      - "ATR_5_pct_M15"
      - "dist_from_ema_10_M15"
      - "ema10_slope_M15"
      - "volume_oscillator_M15"
      - "obv_M15"
      - "hour_sin"
      - "hour_cos"
      - "day_of_week_sin"
      - "day_of_week_cos"
      - "RSI_14_H1"
      - "ADX_14_H1"
      - "EMA_diff_21_H4pct"
      - "RSI_15_x_NYHours"
      - "garch_volatility"
      - "asset_id"
    target_column: "target"
    train_ratio: 0.75
    val_ratio: 0.15
    test_ratio: 0.10
    num_workers: 0
    shuffle_train: false
  
  model:
    name: "MambaFineTuned"
    d_model: 128
    d_state: 16
    d_conv: 4
    n_layers: 4
    dropout: 0.25
    output_dim: 1
  
  training:
    epochs: 50
    learning_rate: 0.00005
    weight_decay: 0.008
    optimizer: "adamw"
    scheduler: "reduce_on_plateau"
    scheduler_patience: 10
    scheduler_factor: 0.7
    scheduler_min_lr: 0.00001
    warmup_epochs: 0
    gradient_clip: 1.5
    accumulation_steps: 2
    freeze_backbone_epochs: 3
    head_lr_multiplier: 10.0
    early_stopping_patience: 15
    early_stopping_min_delta: 0.000001
    save_best_only: true
  
  loss:
    type: "confidence_weighted"
    wrong_sign_penalty: 3.0
    magnitude_weight: 0.4

# Shared paths
paths:
  output_dir: "/kaggle/working"
  checkpoint_dir: "checkpoints"
  results_dir: "results"
  logs_dir: "logs"

# Device configuration
device:
  use_cuda: true
  device_id: 0
  mixed_precision: true

# Logging configuration
logging:
  log_interval: 10
  save_interval: 1
  tensorboard: true
  wandb: false

# Evaluation configuration
evaluation:
  metrics:
    - "mae"
    - "rmse"
    - "mse"
    - "r2_score"
    - "sign_accuracy"
  plot_predictions: true
  plot_residuals: true
  plot_training_curves: true